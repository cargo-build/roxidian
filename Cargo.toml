[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/cargo-build/roxidian"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
